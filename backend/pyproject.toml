[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "data"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py311"
line-length = 160
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Unused imports already present in these modules; the rule stays on everywhere else.
"app/api/reports.py" = ["F401"]
"app/api/settings.py" = ["F401"]
"app/seed/scenario.py" = ["F401"]
"tests/test_payments_list_and_detail.py" = ["F401"]
